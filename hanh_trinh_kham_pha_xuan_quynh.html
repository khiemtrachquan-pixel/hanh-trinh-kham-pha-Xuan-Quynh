<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hành Trình Khám Phá – Xuân Quỳnh</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap');
:root{--navy:#07345d;--blue:#1168a6;--sky:#8bd4f5;--ice:#eaf8ff;--white:#fff;--gold:#ffd782}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:'Be Vietnam Pro',sans-serif;color:var(--navy);background:linear-gradient(160deg,#062d55,#1683bd 55%,#8dd9f6);overflow:hidden}
body:before,body:after{content:"";position:fixed;border-radius:50%;background:#ffffff15;pointer-events:none}
body:before{width:480px;height:480px;top:-180px;left:-120px}
body:after{width:600px;height:600px;bottom:-300px;right:-180px}
.shell{width:min(960px,96vw);min-height:min(650px,90vh);position:relative;border:1px solid #ffffff75;border-radius:28px;overflow:hidden;background:linear-gradient(180deg,#eaf8ffed,#d5f0ffef);box-shadow:0 25px 80px #03294a70}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:22px 30px 12px;gap:12px}
.brand{font-weight:800;letter-spacing:.04em;color:#135b91;font-size:14px}
.progress-wrap{width:42%;height:9px;border-radius:99px;background:#b7d9ee;overflow:hidden}
.progress{height:100%;width:0;background:linear-gradient(90deg,#1682c1,#53c2ed);border-radius:99px;transition:width .5s}
.counter{font-size:13px;font-weight:700;color:#286a99}
.content{padding:20px 7% 30px;position:relative;z-index:1}
h1,h2{font-family:'Playfair Display',serif}
h1{font-size:clamp(32px,5vw,60px);line-height:1.12;margin:12px 0;color:#07345d}
h2{font-size:clamp(24px,3.2vw,36px);line-height:1.35;margin:12px 0 24px}
p{line-height:1.7}
.eyebrow{display:inline-block;padding:8px 15px;border-radius:99px;background:#c6eaff;color:#146295;font-weight:800;font-size:13px;letter-spacing:.05em}
.subtitle{font-size:18px;color:#31698e;max-width:600px;margin:12px auto 24px}
.center{text-align:center}
.boat{font-size:84px;filter:drop-shadow(0 8px 5px #0b4a7025);animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-9px)}}
button{font:inherit;cursor:pointer}
.primary{border:0;border-radius:999px;padding:15px 28px;font-weight:800;color:white;background:linear-gradient(120deg,#07558e,#1789c4);box-shadow:0 8px 18px #0c63944a;transition:.2s}
.primary:hover{transform:translateY(-2px);filter:brightness(1.08)}
.answers{display:grid;gap:13px}
.answer{width:100%;text-align:left;padding:17px 20px;border:2px solid #acd8f0;background:#ffffffc9;border-radius:17px;color:#164e77;font-weight:600;line-height:1.55;transition:.2s;display:flex;align-items:flex-start;gap:14px}
.answer:hover:not(:disabled){border-color:#258bc6;background:#fff;transform:translateY(-2px)}
.letter{display:grid;place-items:center;flex:0 0 36px;height:36px;border-radius:11px;background:#d8efff;font-weight:800;color:#0d659a}
.answer.correct{border-color:#31a979;background:#e5fff2;color:#126743}
.answer.wrong{border-color:#e58c8c;background:#fff0f0;color:#943b43}
.answer:disabled{cursor:default}
.feedback{min-height:48px;margin:16px 0 4px;font-weight:700}
.feedback.ok{color:#188357}.feedback.no{color:#a14b51}
.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}
.secondary{border:1px solid #8dbfdd;border-radius:99px;padding:12px 18px;background:#ffffff80;color:#14577f;font-weight:700}
.hidden{display:none!important}
.decor{position:absolute;bottom:-10px;left:0;right:0;height:110px;opacity:.4;pointer-events:none;background:radial-gradient(ellipse at 15% 100%,#4fb4e4 0 40%,transparent 41%),radial-gradient(ellipse at 75% 100%,#6bc4ec 0 45%,transparent 46%)}
.result-score{font-size:clamp(50px,8vw,90px);font-weight:800;color:#0d73ac;margin:8px}
.note{font-size:13px;color:#517c99}
@media(max-width:600px){.topbar{padding:18px 18px 8px}.content{padding:18px 5% 26px}.answer{padding:13px 14px}.shell{min-height:80vh}.progress-wrap{width:35%}}
</style>
</head>
<body>
<main class="shell">
  <div class="topbar">
    <div class="brand">⚓ HÀNH TRÌNH KHÁM PHÁ</div>
    <div class="progress-wrap"><div class="progress" id="progress"></div></div>
    <div class="counter" id="counter"></div>
  </div>
  <div class="content center" id="welcome">
    <div class="boat">⛵</div>
    <div class="eyebrow">TRÒ CHƠI TRẮC NGHIỆM</div>
    <h1>Chinh phục<br>Xuân Quỳnh</h1>
    <p class="subtitle">Cùng lên thuyền, khám phá những dấu ấn thú vị về cuộc đời và phong cách thơ của nữ thi sĩ!</p>
    <button class="primary" onclick="startQuiz()">Bắt đầu hành trình&nbsp; →</button>
    <p class="note">3 câu hỏi · Chọn đáp án đúng · Tích lũy điểm</p>
  </div>
  <div class="content hidden" id="quiz">
    <div class="eyebrow" id="qtag">CÂU 1</div>
    <h2 id="question"></h2>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div class="footer"><button class="secondary" onclick="restart()">↻ Chơi lại</button><button class="primary hidden" id="next" onclick="nextQuestion()">Tiếp tục →</button></div>
  </div>
  <div class="content center hidden" id="result">
    <div class="boat">🌊⛵🌊</div>
    <div class="eyebrow">ĐÃ CẬP BẾN!</div>
    <h1>Hoàn thành<br>hành trình</h1>
    <div class="result-score" id="score"></div>
    <p class="subtitle" id="resultText"></p>
    <button class="primary" onclick="restart()">Khởi hành lần nữa ↻</button>
  </div>
  <div class="decor"></div>
</main>
<script>
const data=[
 {q:"Năm sinh, năm mất của Xuân Quỳnh:",a:["1940–1989","1942–1988","1938–1978","1942–1980"],correct:1,explain:"Đáp án B. Xuân Quỳnh (1942–1988), là một trong những gương mặt tiêu biểu của thơ ca Việt Nam hiện đại."},
 {q:"Dòng nào dưới đây nói đúng đặc điểm phong cách thơ Xuân Quỳnh?",a:["Giàu yếu tố tự thuật, giàu nữ tính, chân thành đằm thắm, mang nhiều dự cảm lo âu về tình yêu, về cuộc đời.","Giàu yếu tố tự thuật, hồn thơ mê đắm tài hoa.","Giàu yếu tố tự thuật, giàu nữ tính, chân thành đằm thắm, triết lí sâu xa về cuộc đời."],correct:0,explain:"Đáp án A. Thơ Xuân Quỳnh thường chân thành, đằm thắm, giàu nữ tính và thể hiện những âu lo, khát vọng trong tình yêu, cuộc sống."},
 {q:"Đề tài nổi bật trong thơ Xuân Quỳnh là gì?",a:["Tình yêu, hạnh phúc gia đình, trẻ em.","Chiến tranh, tình yêu.","Gia đình, tình yêu, quê hương đất nước."],correct:0,explain:"Đáp án A. Tình yêu, mái ấm gia đình và thế giới trẻ thơ là những mảng đề tài nổi bật trong thơ Xuân Quỳnh."}
];
let index=0,score=0,locked=false;
const $=id=>document.getElementById(id);
function startQuiz(){$("welcome").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");index=0;score=0;showQuestion()}
function showQuestion(){
 locked=false;$("feedback").textContent="";$("feedback").className="feedback";$("next").classList.add("hidden");
 $("counter").textContent=`${index+1} / ${data.length}`;$("progress").style.width=`${index/data.length*100}%`;
 $("qtag").textContent=`CÂU ${index+1}`;$("question").textContent=data[index].q;
 $("answers").innerHTML="";
 data[index].a.forEach((answer,i)=>{
  const b=document.createElement("button");b.className="answer";
  b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span>${answer}</span>`;
  b.onclick=()=>choose(i,b);$("answers").appendChild(b)
 });
}
function choose(i,button){
 if(locked)return;locked=true;const correct=data[index].correct;
 [...$("answers").children].forEach((b,j)=>{b.disabled=true;if(j===correct)b.classList.add("correct");});
 if(i===correct){score++;$("feedback").textContent="✓ Chính xác! "+data[index].explain;$("feedback").classList.add("ok")}
 else{$("feedback").textContent="✦ Chưa chính xác. "+data[index].explain;$("feedback").classList.add("no");button.classList.add("wrong")}
 $("progress").style.width=`${(index+1)/data.length*100}%`;
 $("next").textContent=index===data.length-1?"Xem kết quả →":"Câu tiếp theo →";$("next").classList.remove("hidden");
}
function nextQuestion(){index++;if(index<data.length)showQuestion();else finish()}
function finish(){
 $("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("counter").textContent="";$("progress").style.width="100%";
 $("score").textContent=`${score}/${data.length}`;
 $("resultText").textContent=score===3?"Xuất sắc! Chị đã cập bến với kiến thức vững vàng!":score===2?"Rất tốt! Thêm một chút khám phá nữa là thật hoàn hảo!":"Cảm ơn đã tham gia! Hãy thử lại để khám phá và ghi nhớ thêm nhé!";
}
function restart(){$("result").classList.add("hidden");$("quiz").classList.add("hidden");$("welcome").classList.remove("hidden");$("progress").style.width="0%";$("counter").textContent=""}
</script>
</body>
</html>
